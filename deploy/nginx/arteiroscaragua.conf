# Configuração inicial em HTTP. O Certbot adiciona o HTTPS depois da virada do DNS.

# Sem query string nem Referer: URLs de login e de e-mail carregam tokens.
log_format arteiros_sem_query '$remote_addr [$time_local] "$request_method $uri" '
                              '$status $body_bytes_sent $request_time "$http_user_agent"';

proxy_cache_path /var/cache/nginx/arteiros levels=1:2 keys_zone=arteiros_static:10m
                 max_size=512m inactive=7d use_temp_path=off;

upstream arteiros_api   { server 127.0.0.1:4001; keepalive 16; }
upstream arteiros_admin { server 127.0.0.1:4002; keepalive 16; }
upstream arteiros_site  { server 127.0.0.1:4003; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name arteiros.robotizando.com.br;

    access_log /var/log/nginx/arteiros.access.log arteiros_sem_query;
    # Nível "error" registraria a URL completa, com tokens. Diagnóstico de app: pm2 logs.
    error_log /var/log/nginx/arteiros.error.log crit;

    include snippets/arteiros-gzip.conf;
    client_max_body_size 1m;

    location /api/ {
        client_max_body_size 30m;
        include snippets/arteiros-proxy.conf;
        proxy_pass http://arteiros_api;
    }

    location /_next/static/ {
        include snippets/arteiros-proxy.conf;
        proxy_cache arteiros_static;
        proxy_cache_key "site$uri$is_args$args";
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://arteiros_site;
    }

    location / {
        include snippets/arteiros-proxy.conf;
        proxy_pass http://arteiros_site;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.arteiros.robotizando.com.br;

    access_log /var/log/nginx/arteiros-admin.access.log arteiros_sem_query;
    error_log /var/log/nginx/arteiros-admin.error.log crit;

    include snippets/arteiros-gzip.conf;
    client_max_body_size 1m;

    location /_next/static/ {
        include snippets/arteiros-proxy.conf;
        proxy_cache arteiros_static;
        proxy_cache_key "admin$uri$is_args$args";
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://arteiros_admin;
    }

    location / {
        include snippets/arteiros-proxy.conf;
        proxy_pass http://arteiros_admin;
    }
}
